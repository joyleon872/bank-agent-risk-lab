# Runs a small eval suite automatically whenever the agent, its prompt, documents,
# guardrails or tests change. "Reassess after material changes", in practice.
name: Agent risk evals

on:
  push:
    branches: [main]
    paths: ["app/**", "data/**", "evals/**", "requirements.txt", ".github/workflows/evals.yml"]
  pull_request:
    paths: ["app/**", "data/**", "evals/**", "requirements.txt"]
  workflow_dispatch:   # lets you start it manually from the Actions tab

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run CI eval suite (all controls on, 8 cases x 2 runs)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.run_evals --subset ci --configs guardrails_kbscan --repeats 2 --fail-on-risk
      - name: Save the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: results/
