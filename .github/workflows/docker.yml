# Builds the container image and publishes it to GitHub Container Registry
# (ghcr.io/joyleon872/bank-agent-risk-lab) on every change to the app.
name: Build and publish image

on:
  push:
    branches: [main]
    paths: ["app/**", "data/**", "requirements.txt", "Dockerfile", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
